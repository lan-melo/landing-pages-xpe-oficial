<style>
  :root{
    /* Black tones normalized to match the XP Educação logo background (pure neutral black) */
    --bg: #0A0A0A;
    --bg-2: #121212;
    --surface: #181818;
    --surface-2: #1F1F1F;
    --line: rgba(255,255,255,0.09);
    --line-strong: rgba(255,255,255,0.18);
    --text: #F4F4F0;
    --muted: rgba(244,244,240,0.62);
    --dim: rgba(244,244,240,0.42);
    --accent: #F5C518;          /* warm institutional yellow */
    --accent-soft: rgba(245,197,24,0.14);
    --accent-line: rgba(245,197,24,0.35);
  }
  html,body{background:var(--bg);color:var(--text);font-family:'Geist',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .font-serif{font-family:'Instrument Serif',ui-serif,Georgia,serif;font-weight:400;letter-spacing:-0.01em;}
  .font-mono{font-family:'Geist Mono',ui-monospace,monospace;}
  .text-accent{color:var(--accent);}
  .bg-accent{background:var(--accent);}
  .bg-surface{background:var(--surface);}
  .bg-surface-2{background:var(--surface-2);}
  .border-line{border-color:var(--line);}
  .border-line-strong{border-color:var(--line-strong);}
  .text-muted{color:var(--muted);}
  .text-dim{color:var(--dim);}
  .grid-bg{
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 64px 64px;
  }
  .hatch{
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 8px);
  }
  .hatch-accent{
    background-image: repeating-linear-gradient(135deg, rgba(245,197,24,0.22) 0 1px, transparent 1px 7px);
  }
  .caret::after{content:""; display:inline-block; width:8px; height:8px; background:var(--accent); margin-left:8px; transform:translateY(-2px);}
  .kbd{font-family:'Geist Mono',monospace; font-size:11px; padding:2px 6px; border:1px solid var(--line-strong); border-radius:3px; color:var(--muted);}
  .ticker{ letter-spacing:0.18em; text-transform:uppercase; }
  /* dotted/dashed leader between number and label */
  .leader{ flex:1; border-bottom:1px dotted rgba(255,255,255,0.18); margin:0 10px 6px; }
  /* tiny ribbed divider used in section headers */
  .ribbed{
    background-image: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px 6px);
    height:1px;
  }
  details > summary { list-style:none; cursor:pointer;}
  details > summary::-webkit-details-marker { display:none; }
  .scrollbar-thin::-webkit-scrollbar{ height:6px;}
  .scrollbar-thin::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:3px;}
  input, select, textarea{ font-family:inherit;}
  /* checkbox-like radio */
  .radio-card:has(input:checked){ border-color: var(--accent); background: var(--accent-soft); }
  /* underline highlight for headline accent words */
  .ink{ background-image: linear-gradient(transparent 70%, rgba(245,197,24,0.35) 70%); padding: 0 .08em; }

  /* ===== Launch hero: bigger, condensed feel via serif + tight tracking ===== */
  .launch-headline{
    font-family:'Instrument Serif',ui-serif,Georgia,serif;
    text-transform:uppercase;
    letter-spacing:-0.025em;
    line-height:0.88;
    font-weight:400;
  }
  .launch-headline > span{ display:block; white-space:nowrap; }
  .launch-headline em{ font-style: italic; }
  /* heavier grid on the launch hero */
  .launch-grid{
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 80px 80px;
  }
  /* faint diagonal in the corner of equation blocks */
  .eq-hatch{
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 9px);
  }
</style>

<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">





























const { useState, useEffect, useRef, useMemo } = React;

/* ==================== ATOMS ==================== */
const Icon = ({ name, className = "w-4 h-4", strokeWidth = 1.5 }) => {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const el = document.createElement('i');
      el.setAttribute('data-lucide', name);
      ref.current.appendChild(el);
      window.lucide.createIcons({ attrs: { 'stroke-width': strokeWidth }, nameAttr: 'data-lucide' });
    }
  }, [name, strokeWidth]);
  return <span ref={ref} className={"inline-flex items-center justify-center " + className} />;
};

const Tag = ({ children, tone = "default", className = "" }) => {
  const tones = {
    default: "border-line text-muted",
    accent: "border-[color:var(--accent-line)] text-accent bg-[color:var(--accent-soft)]",
    solid: "bg-accent text-black border-transparent"
  };
  return (
    <span className={"font-mono text-[10px] uppercase tracking-[0.18em] px-2 py-1 border rounded-sm " + tones[tone] + " " + className}>
      {children}
    </span>);

};

const SectionHead = ({ index, kicker, title, sub, alignLeft = true }) =>
<div className={"mb-10 lg:mb-14 " + (alignLeft ? "" : "text-center")}>
    <div className={"flex items-center gap-3 mb-5 " + (alignLeft ? "" : "justify-center")}>
      <span className="font-mono text-[11px] text-accent tracking-[0.22em]">§{String(index).padStart(2, '0')}</span>
      <span className="ribbed flex-1 max-w-[120px]" />
      <span className="font-mono text-[11px] text-muted uppercase tracking-[0.22em]">{kicker}</span>
    </div>
    <h2 className="font-serif text-4xl md:text-5xl lg:text-6xl leading-[1.02] max-w-4xl">
      {title}
    </h2>
    {sub && <p className="mt-5 text-muted max-w-2xl text-[15px] leading-relaxed">{sub}</p>}
  </div>;


const CTAButton = ({ children, variant = "primary", size = "md", className = "", icon = "arrow-right", onClick, href = "#interesse" }) => {
  const base = "inline-flex items-center gap-2 font-medium transition-colors";
  const sizes = { md: "px-5 py-3 text-sm", lg: "px-6 py-3.5 text-[15px]" };
  const variants = {
    primary: "bg-accent text-black hover:bg-yellow-300",
    ghost: "border border-line-strong text-white hover:bg-white/5"
  };
  const inner = (
    <>
      <span>{children}</span>
      {icon && <Icon name={icon} className="w-4 h-4" />}
    </>);

  if (onClick) {
    return (
      <button type="button" onClick={onClick} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>
        {inner}
      </button>);
  }
  return (
    <a href={href} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>
      {inner}
    </a>);

};

const openACForm = () => window.dispatchEvent(new CustomEvent("open-ac-form"));

/* ==================== ACTIVE CAMPAIGN MODAL ==================== */
const ACFormModal = () => {
  const [open, setOpen] = useState(false);
  const containerRef = useRef(null);
  const loadedRef = useRef(false);

  useEffect(() => {
    const onOpen = () => setOpen(true);
    const onKey = (e) => {if (e.key === "Escape") setOpen(false);};
    window.addEventListener("open-ac-form", onOpen);
    window.addEventListener("keydown", onKey);
    return () => {
      window.removeEventListener("open-ac-form", onOpen);
      window.removeEventListener("keydown", onKey);
    };
  }, []);

  useEffect(() => {
    document.body.style.overflow = open ? "hidden" : "";
    if (open && containerRef.current && !loadedRef.current) {
      const formDiv = document.createElement("div");
      formDiv.className = "_form_691";
      containerRef.current.appendChild(formDiv);
      const script = document.createElement("script");
      script.src = "https://email.xpeducacao.com.br/f/embed.php?id=691";
      script.charset = "utf-8";
      script.async = true;
      containerRef.current.appendChild(script);
      loadedRef.current = true;
    }
  }, [open]);

  return (
    <div
      className={"fixed inset-0 z-[100] transition-opacity " + (open ? "opacity-100 pointer-events-auto" : "opacity-0 pointer-events-none")}
      aria-hidden={!open}>
      <div className="absolute inset-0 bg-black/75 backdrop-blur-sm" onClick={() => setOpen(false)} />
      <div className="relative h-full w-full flex items-center justify-center p-4">
        <div className="relative bg-white text-black w-full max-w-[640px] max-h-[92vh] overflow-auto shadow-2xl rounded-md">
          <button
            type="button"
            onClick={() => setOpen(false)}
            aria-label="Fechar"
            className="absolute top-3 right-3 w-9 h-9 inline-flex items-center justify-center rounded hover:bg-black/10 z-10">
            <Icon name="x" className="w-5 h-5" />
          </button>
          <div ref={containerRef} className="ac-form-container p-6 pt-12" />
        </div>
      </div>
    </div>);

};

/* ==================== LAUNCH HERO (Formação Assessor do Futuro) ==================== */
const smoothScrollTo = (id) => {
  const el = document.getElementById(id);
  if (!el) return;
  const y = el.getBoundingClientRect().top + window.scrollY - 56; // offset for sticky bar
  window.scrollTo({ top: y, behavior: 'smooth' });
};

const LaunchHero = () =>
<section className="relative border-b border-line bg-[var(--bg)] overflow-hidden">
    {/* heavy grid bg */}
    <div className="absolute inset-0 launch-grid opacity-50 pointer-events-none" />
    {/* subtle accent wash bottom-right */}
    <div className="absolute -right-40 -bottom-40 w-[640px] h-[640px] rounded-full pointer-events-none"
  style={{ background: "radial-gradient(circle, rgba(245,197,24,0.10) 0%, rgba(245,197,24,0) 60%)" }} />

    <div className="max-w-[1280px] mx-auto px-6 lg:px-10 pt-14 lg:pt-24 pb-16 lg:pb-24 relative">
      {/* eyebrow */}
      <div className="mb-10 lg:mb-14">
        <span className="font-mono text-[11px] text-accent tracking-[0.28em] uppercase">Lançamento exclusivo B2B Experience</span>
      </div>

      <div>
        <h1 className="launch-headline text-[44px] sm:text-[64px] lg:text-[104px] xl:text-[120px]">
          <span className="text-white">O assessor do futuro</span>
          <span className="text-accent">começa <em>aqui</em>.</span>
        </h1>
      </div>

      {/* subheadline + cta */}
      <div className="mt-12 lg:mt-16 max-w-3xl">
        <p className="text-[16px] lg:text-[18px] leading-relaxed" style={{ color: "rgba(244,244,240,0.78)" }}>
          Nos últimos anos, formamos os melhores assessores do mercado financeiro brasileiro, <span className="text-white font-medium">+10.000 pessoas impactadas</span>, da certificação e onboarding ao topo da rede. Agora chegou o próximo passo: unimos o método do <span className="text-white">XP Academy</span> à plataforma <span className="text-white">XP Educação</span> para formar, em escala, o assessor que o futuro vai exigir.
        </p>

        <div className="mt-9">
          <a href="#equacao"
        onClick={(e) => {e.preventDefault();smoothScrollTo('equacao');}}
        className="inline-flex items-center gap-2 bg-accent text-black font-medium px-7 py-4 text-[15px] uppercase tracking-[0.14em] hover:bg-yellow-300 transition-colors">
            <span>QUERO CONHECER</span>
            <Icon name="arrow-down" className="w-4 h-4" />
          </a>
        </div>
      </div>
    </div>
</section>;


/* ==================== TRANSITION BAND — A + B = C ==================== */
const InputBlock = ({ tag, line, segments, footnote }) =>
<div className="relative border border-line bg-surface p-6 lg:p-7 flex flex-col h-full">
    <div className="absolute inset-0 eq-hatch pointer-events-none" />
    <div className="relative flex items-center justify-between mb-5">
      <span className="font-mono text-[10px] tracking-[0.24em] uppercase text-accent">{tag}</span>
      <span className="w-1.5 h-1.5 bg-accent rotate-45" />
    </div>
    <h3 className="relative font-serif text-[22px] lg:text-[26px] leading-[1.15] mb-5">
      {line}
    </h3>
    <div className="relative ribbed mb-5" />
    <ul className="relative space-y-4">
      {segments.map((s, i) =>
    <li key={i} className="text-[13px] leading-snug">
          {s.label ?
      <div className="flex flex-col gap-1.5">
                <span className="inline-flex items-center gap-2">
                  <span className="w-1 h-1 bg-accent shrink-0" />
                  <span className="font-mono text-[10px] text-accent tracking-[0.22em] uppercase">{s.label}</span>
                </span>
                <span className="block" style={{ color: "rgba(244,244,240,0.82)" }}>{s.text}</span>
              </div> :
      <div className="flex gap-3">
                <span className="text-accent shrink-0">▸</span>
                <span style={{ color: "rgba(244,244,240,0.78)" }}>{s.text}</span>
              </div>
      }
        </li>
    )}
    </ul>
    {footnote &&
  <div className="relative mt-auto pt-10">
        <div className="pt-5 border-t border-line font-mono text-[10px] text-dim tracking-[0.18em] uppercase leading-relaxed">
          {footnote}
        </div>
      </div>
  }
</div>;

const Operator = ({ symbol }) =>
<div className="flex lg:flex-col items-center justify-center py-2 lg:py-0 select-none">
    <div className="font-serif text-accent text-[88px] lg:text-[120px] leading-none tracking-[-0.04em]">{symbol}</div>
</div>;

const ProductBlock = () =>
<div className="relative border border-accent bg-[color:var(--accent-soft)] p-7 lg:p-9 flex flex-col h-full overflow-hidden">
    {/* corner tickmarks */}
    {["top-2 left-2", "top-2 right-2", "bottom-2 left-2", "bottom-2 right-2"].map((p) =>
  <span key={p} className={"absolute " + p + " font-mono text-[10px] text-accent/60"}>+</span>
  )}
    {/* accent wash */}
    <div className="absolute -right-24 -bottom-24 w-[320px] h-[320px] rounded-full pointer-events-none"
  style={{ background: "radial-gradient(circle, rgba(245,197,24,0.18) 0%, rgba(245,197,24,0) 65%)" }} />

    <div className="relative flex items-center justify-between mb-5">
      <span className="font-mono text-[10px] tracking-[0.24em] uppercase text-accent">· LANÇAMENTO 2026</span>
      <span className="w-2 h-2 bg-accent rotate-45" />
    </div>

    <h3 className="relative font-serif text-[34px] lg:text-[44px] xl:text-[48px] leading-[1.02] tracking-[-0.01em] mb-5">
      Formação <span className="italic text-accent">Assessor do Futuro</span>.
    </h3>

    <div className="relative ribbed mb-5" style={{ backgroundImage: "repeating-linear-gradient(to right, rgba(245,197,24,0.45) 0 1px, transparent 1px 6px)" }} />

    <ul className="relative space-y-3 mb-7">
      {[
    { n: "01", t: "Imersão e Prática", s: "3 dias presenciais em SP, conteúdo online e IA de prática contínua." },
    { n: "02", t: "Conexão com a Rede", s: "Advisor Experience e ExpertXP, os eventos dos melhores da rede." },
    { n: "03", t: "Certificação CFP® + Comunidade", s: "O salto. Consultora dedicada e acesso vitalício à elite do planejamento." }].
    map((it, i) =>
    <li key={i} className="flex gap-3">
          <span className="font-mono text-[10px] text-accent tracking-[0.22em] uppercase shrink-0 pt-[3px]">{it.n}</span>
          <div className="min-w-0">
            <div className="text-[14px] font-medium leading-tight" style={{ color: "rgba(244,244,240,0.95)" }}>{it.t}</div>
            <div className="text-[12.5px] leading-snug mt-1" style={{ color: "rgba(244,244,240,0.72)" }}>{it.s}</div>
          </div>
        </li>
    )}
    </ul>

    <a href="#lp-original"
  onClick={(e) => {e.preventDefault();smoothScrollTo('lp-original');}}
  className="relative mt-auto inline-flex items-center justify-between bg-accent text-black font-medium px-5 py-3.5 text-[13px] uppercase tracking-[0.18em] hover:bg-yellow-300 transition-colors group">
      <span>Conheça o programa</span>
      <Icon name="arrow-down" className="w-4 h-4" />
    </a>
</div>;

const TransitionBand = () =>
<section id="equacao" className="relative border-b border-line bg-[var(--bg-2)]">
    <div className="max-w-[1280px] mx-auto px-6 lg:px-10 py-14 lg:py-20">
      {/* short framing */}
      <h2 className="font-serif text-3xl md:text-4xl lg:text-[44px] leading-[1.05] tracking-[-0.01em] max-w-3xl mb-10 lg:mb-12">
        A combinação que   <span className="italic text-accent"> só a XP tem</span>
      </h2>

      {/* A + B = C equation — A and B equal, C highlighted/larger */}
      <div className="grid lg:grid-cols-[1fr_auto_1fr_auto_1.35fr] gap-5 lg:gap-4 items-stretch">
        <InputBlock
        tag="XP Academy"
        line={<>Expertise em <span className="italic">produtividade comercial</span>.</>}
        segments={[
        { label: "Foundation", text: "Onboarding e Lab. Alta Performance, base da carreira" },
        { label: "Performance", text: "Aceleradora Comercial e Rota Top 100, captação no topo" },
        { label: "Elite", text: "Advisor Experience, Consultor 3.0, Rumo ao Private, Executive Club" }]
        } />
      
      

        <Operator symbol="+" />

        <InputBlock
        tag="XP Educação"
        line={<>A edtech que forma o <span className="italic">mercado financeiro</span>.</>}
        segments={[
        { label: "Plataforma", text: "+20.000 alunos ativos em estrutura digital escalável" },
        { label: "Método", text: "Cursos preparatórios ANCORD, ANBIMA e CFP® com professores de ponta" },
        { label: "Qualidade", text: "Educação certificada, entregue com consistência em escala" }]
        } />
      
      

        <Operator symbol="=" />

        <ProductBlock />
      </div>
    </div>
</section>;


/* ==================== TOP BAR ==================== */
const TopBar = () =>
<div className="border-b border-line sticky top-0 z-40 backdrop-blur bg-[var(--bg)]/85">
    <div className="max-w-[1280px] mx-auto px-6 lg:px-10 h-14 flex items-center justify-between">
      <div className="flex items-center gap-3">
        <img src="/certificacoes/assets/logo_xp_white.webp" alt="XP" className="h-5 w-auto block opacity-90" />
      </div>
      <nav className="hidden md:flex items-center gap-6 text-[13px] text-muted">
        <a className="hover:text-white" href="#resultados">Resultados</a>
        <a className="hover:text-white" href="#jornada">Jornada</a>
        <a className="hover:text-white" href="#imersao">Imersão</a>
        <a className="hover:text-white" href="#cfp">CFP®</a>
        <a className="hover:text-white" href="#comunidade">Comunidade</a>
        <a className="hover:text-white" href="#faq">FAQ</a>
      </nav>
      <CTAButton size="md" icon={null} onClick={openACForm}>Tenho interesse</CTAButton>
    </div>
  </div>;


/* ==================== SECTION 01 — HERO ==================== */
const HeroVisual = () =>
<div className="relative lg:h-[560px] border border-line bg-surface overflow-hidden flex flex-col">
    {/* corner tickmarks */}
    {["top-3 left-3", "top-3 right-3", "bottom-3 left-3", "bottom-3 right-3"].map((p) =>
  <span key={p} className={`absolute ${p} font-mono text-[10px] text-dim z-10`}>+</span>
  )}
    {/* exhibit header */}
    <div className="flex items-center justify-between px-5 py-3 border-b border-line bg-[var(--surface-2)]">
      <span className="font-mono text-[10px] tracking-[0.22em] text-accent">EXHIBIT · PROGRAMA PILOTO</span>
      <span className="font-mono text-[10px] tracking-[0.22em] text-dim hidden sm:inline">PILOTO ÷ CONTROLE</span>
    </div>
    {/* three indicator rows */}
    <div className="flex-1 flex flex-col">
      {[
    { n: "01", name: "Mapeamento", mult: "6×", pilotoW: 100, controlW: 17 },
    { n: "02", name: "Conversão", mult: "4,5×", pilotoW: 66, controlW: 15 },
    { n: "03", name: "Captação", mult: "+36%", pilotoW: 56, controlW: 41 }].
    map((r, i, arr) =>
    <div key={i} className={"px-5 lg:px-6 py-5 lg:py-7 flex-1 flex flex-col justify-center " + (i < arr.length - 1 ? "border-b border-line" : "")}>
          <div className="flex items-baseline gap-3 mb-3">

          Para assessores em qualquer estágio. Iniciantes e intermédiarios encontram aqui o ponto de entrada certo: a imersão de 3 dias, a IA de prática e os eventos da rede aceleram a curva sem exigir pré-requisito técnico. Seniores em evolução podem ir direto à Fase 3 (CFP®); para esse perfil, recomendamos a LP da Formação CFP de Alta Performance.
        </FAQItem>
        <FAQItem n="02" q="Posso inscrever a mim mesmo, meus assessores, ou ambos?">
          Sim, para os três cenários. O programa foi desenhado para sócios em carreira avançada, que também atuam como assessores, e para assessores indicados pelo escritório. No formulário de interesse, o sócio sinaliza para quem é a inscrição.
        </FAQItem>
        <FAQItem n="03" q="Como funciona o conteúdo online e a ferramenta de IA?">
          O conteúdo online é assíncrono e fica disponível antes, durante e depois dos 3 dias presenciais. A IA permite que o assessor pratique atendimentos, peça análise dos próprios pitches e treine objeções na rotina, quantas vezes precisar, sem comprometer a produção.
        </FAQItem>
        <FAQItem n="04" q="Quem ministra a imersão de 3 dias?">
          Profissionais com vivência prática: assessores e líderes de alta performance da rede XP, que trazem credibilidade e exemplos reais. Não professores de sala de aula.
        </FAQItem>
        <FAQItem n="05" defaultOpen q="Por que esta formação e não um treinamento corporativo qualquer?">
          <p>Existe diferença material em cinco eixos. Em todos eles, a Imersão de Alta Performance entrega algo que um treinamento corporativo não oferece:</p>
          <CompareTable />
        </FAQItem>
        <FAQItem n="06" q="Quando faz sentido fazer o CFP®?">
          O CFP® é o destino natural. Não existe assessor de alta performance que não passe por ele em algum momento. A Imersão de Alta Performance é a porta de entrada da trilha; o CFP® é o salto. Quando o aluno estiver pronto, a Consultora Educacional XP dedicada acompanha o processo do diagnóstico à prova.
        </FAQItem>
        <FAQItem n="07" q="Como meus assessores entram na Comunidade exclusiva?">
          A entrada requer aprovação no CFP®, melhor performance na turma, vínculo ativo na rede e indicadores consistentes. Sem CFP®, não há entrada: esse é o gatilho que separa quem chega à elite dos demais.
        </FAQItem>
        <FAQItem n="08" q="Já tenho CFP®, posso ser professor?">
          Sim. As vagas de docentes não estão fechadas: temos um processo seletivo aberto, com vagas remuneradas, para profissionais CFP® que queiram ensinar na formação. Manifeste interesse no formulário abaixo e nossa equipe entrará em contato com os próximos passos.
        </FAQItem>
      </div>
    </div>
  </section>;
