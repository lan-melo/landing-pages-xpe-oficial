const Icon = ({ name, className = "w-4 h-4", strokeWidth = 1.5 }) => {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const el = document.createElement('i');
      el.setAttribute('data-lucide', name);
      ref.current.appendChild(el);
      window.lucide.createIcons({ attrs: { 'stroke-width': strokeWidth }, nameAttr: 'data-lucide' });
    }
  }, [name, strokeWidth]);
  return <span ref={ref} className={"inline-flex items-center justify-center " + className} />;
};

const Tag = ({ children, tone = "default", className = "" }) => {
  const tones = {

  return (
    <span className={"font-mono text-[10px] uppercase tracking-[0.18em] px-2 py-1 border rounded-sm " + tones[tone] + " " + className}>
      {children}
    </span>);

};
